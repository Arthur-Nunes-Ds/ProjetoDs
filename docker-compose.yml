version: '3.8'

#banco + api
services:
  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${SENHA_ROOT_DB}
      MYSQL_DATABASE: ${BANCO_DB}
      MYSQL_USER: ${USER_DB}
      MYSQL_PASSWORD: ${SENHA_DB}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$SENHA_ROOT_DB || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # AUMENTADO para 120s para garantir que bancos lentos tenham tempo de inicializar do zero
      start_period: 120s

  redis:
    image: redis:7
    container_name: redis_secure
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  #nome("um dns interno") para o docker intentificar os serviços internos do docker
  backend_python:
    #criar a "imagem custon" do back end (o Dockerfile)
    build: .
    container_name: backend_python
    restart: always
    ports:
      - "8080:8080"
    #fala para ele que o .env contem os dados da variaveis de abiente
    env_file:
      - path: .env
        required: false
    #fala para o serviço "db"(banco) e espera para o banco está pronto apra roda a API 
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  #HTPSS
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BACK_END=${BACK_END}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Usando | para preservar formatação e comando openssl em linha única
    command: |
      /bin/sh -c "
      if [ ! -f /etc/letsencrypt/live/${BACK_END}/fullchain.pem ]; then
        echo 'Gerando certificado temporário...' &&
        mkdir -p /etc/letsencrypt/live/${BACK_END} &&
        openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout /etc/letsencrypt/live/${BACK_END}/privkey.pem -out /etc/letsencrypt/live/${BACK_END}/fullchain.pem -subj '/CN=localhost';
      fi;
      nginx -g 'daemon off;' &
      while :; do sleep 6h & wait $${!}; nginx -s reload; done"
    depends_on:
      - backend_python

  certbot:
    image: certbot/certbot:latest
    container_name: certbot_renova_certs
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Comando certbot colocado em linha única para evitar quebra de argumentos
    entrypoint: |
      /bin/sh -c "
      trap exit TERM;
      sleep 10;
      certbot certonly --webroot -w /var/www/certbot --cert-name ${BACK_END} -d ${BACK_END} --email ${EMAIL_GOOGLE} --agree-tos --non-interactive || true;
      while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  mysql_data:
  redis_data:

